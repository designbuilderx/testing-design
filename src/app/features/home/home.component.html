<div class="home-component">
  <div *ngIf="selectedComponent$ | async as selectedComponent; else noSelection">
    <h3 class="component-title">{{ selectedComponent.name }} Variants</h3>

    <div class="option-grid">
      <div 
        class="" 
        *ngFor="let opt of getVariants(selectedComponent)"
        [class.selected]="opt.name === selectedOptionName"
        (click)="selectOption(opt)"
      >
        <div [innerHTML]="opt.html | safeHtml"></div>
      </div>
    </div>
  </div>

  <ng-template #noSelection>
    <div class="no-selection">
      Select a component from the left sidebar to see its variants
    </div>
  </ng-template>
</div>
