<aside class="sidebar-right">
  <div class="preview-header">
    <div><strong>{{ previewTitle }}</strong></div>
    <div class="preview-controls">
      <button class="btn" (click)="openMonacoEditor()">Open Editor</button>
      <button class="btn" (click)="resetPreview()">Reset</button>
    </div>
  </div>

   <ng-container *ngIf="selectedComponentHtml$ | async as html; else noSelection">
    <div [innerHTML]="html | safeHtml"></div>
  </ng-container>

  <ng-template #noSelection>
    <div class="preview-box">Select an option to preview</div>
  </ng-template>

  <div class="component-color">
    <label for="componentColor">Component color:</label>
    <input type="color" id="componentColor" [(ngModel)]="componentColor" (input)="updatePreviewColor(componentColor)" />
  </div>
</aside>
