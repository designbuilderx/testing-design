<div class="sidebar-left" [class.open]="drawerOpen">
  <h4 class="section-title">Categories</h4>
  <div class="tree">
    <ul>
      <li *ngFor="let node of componentsTree">
        <!-- Category -->
        <span class="toggle" [class.expanded]="node.expanded" (click)="toggleCategory(node)">
          <i class="fas fa-chevron-right" [class.rotated]="node.expanded"></i>
          {{ node.name }}
        </span>

        <!-- Children -->
        <ul [style.display]="node.expanded ? 'block' : 'none'">
          <li
            *ngFor="let comp of node.children"
            class="component-item"
            [class.active]="comp === selectedComponent"
            (click)="selectComponent(comp, node.name)"
          >
            {{ comp.name }}
          </li>
        </ul>
      </li>
    </ul>
  </div>
</div>
