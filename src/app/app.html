<app-header (toggleSidebar)="sidebarOpen = !sidebarOpen"></app-header>

<div class="workspace">
  <!-- Sidebar-left with drawer functionality -->
  <app-sidebar-left 
    [drawerOpen]="sidebarOpen" 
    (closeDrawer)="sidebarOpen = false">
  </app-sidebar-left>

  <!-- Main content -->
  <main class="center">
    <router-outlet></router-outlet>
  </main>

  <!-- Sidebar-right hidden on mobile/tablet -->
  <app-sidebar-right></app-sidebar-right>
</div>

<!-- Overlay for drawer -->
<div class="drawer-overlay" *ngIf="sidebarOpen" (click)="sidebarOpen = false"></div>
